    <!-- The appearance the last theme had (themes/apply.ts keeps it in
         app.appearance), or the system's, before the first paint: no flash of
         the wrong colours while the app starts. -->
    <script>
      (function () {
        var dark = true;
        try {
          var saved = localStorage.getItem("app.appearance");
          dark = saved ? saved === '"dark"' : matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
